<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jana Online Service - Work Portal</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#1e293b);
padding:20px;
}

.container{
width:100%;
max-width:900px;
background:#fff;
border-radius:20px;
padding:40px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,0.25);
}

.logo{
width:90px;
height:90px;
background:#2563eb;
color:#fff;
margin:auto;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:35px;
font-weight:bold;
}
.logoimage{
width:90px;
height:90px;
background:#2563eb;
color:#fff;
margin:auto;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:35px;
font-weight:bold;
}

h1{
margin-top:20px;
font-size:2.2rem;
color:#0f172a;
}

.subtitle{
margin-top:8px;
font-size:1.1rem;
color:#64748b;
font-weight:500;
}

.portal{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
margin-top:40px;
}

.card{
background:#f8fafc;
border-radius:18px;
padding:30px;
transition:.3s;
cursor:pointer;
border:2px solid transparent;
}

.card:hover{
transform:translateY(-8px);
border-color:#2563eb;
box-shadow:0 10px 25px rgba(37,99,235,.2);
}

.icon{
font-size:50px;
margin-bottom:15px;
}

.card h2{
color:#0f172a;
margin-bottom:10px;
}

.card p{
color:#64748b;
font-size:15px;
margin-bottom:20px;
}

.btn{
display:inline-block;
padding:12px 25px;
background:#2563eb;
color:white;
text-decoration:none;
border-radius:10px;
font-weight:600;
}

.footer{
margin-top:35px;
color:#94a3b8;
font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<p class="subtitle">Compose Work Portal</p>

<p>Compress and optimize your images while maintaining quality.</p>

</div>

<div class="card">
<div class="icon"><image src="https://cdn.dribbble.com/userupload/41808836/file/original-d49083f35e2101fff096c655e15f8a64.gif" height="120px"> </div>

<p>Reduce file size quickly and efficiently.</p>
<a href="https://suman9907bit.github.io/pdf-cpmoser/" class="btn">Open Tool</a>
</div>

</div>

<div class="footer">
© 2026 Jana Online Service | Fast • Secure • Reliable
</div>

</div>

</body>
</html>
